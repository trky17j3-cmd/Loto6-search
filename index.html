<script>
function togglePasteBox() {
  const box = document.getElementById("pasteBox");
  const title = document.querySelector("h3[onclick='togglePasteBox()']");

  if (box.style.display === "none") {
    box.style.display = "block";
    title.textContent = "▲ 予想番号（貼り付け用BOXを閉じる）";
  } else {
    box.style.display = "none";
    title.textContent = "▼ 予想番号（貼り付け用BOXを開く）";
  }
}

function clearPasteBox() {
  document.getElementById("yosoAll").value = "";
}



// 数字の分解（スペース・カンマ・スラッシュ・改行など全部OK）
function parseNums(str) {
  return str
    .trim()
    .split(/[\s,\/]+/)
    .map(n => parseInt(n, 10))
    .filter(n => !isNaN(n));
}

// 最新本数字
function getLatestNumbers() {
  return [
    parseInt(lm1.value), parseInt(lm2.value), parseInt(lm3.value),
    parseInt(lm4.value), parseInt(lm5.value), parseInt(lm6.value)
  ].filter(n => !isNaN(n));
}

// ボーナス数字
function getBonusNumber() {
  const b = parseInt(lb.value);
  return isNaN(b) ? null : b;
}

function updateResults() {
  const latestMain = getLatestNumbers();
  const latestBonus = getBonusNumber();

  const lines = document.getElementById("yosoAll").value
    .trim()
    .split(/\n+/)
    .filter(line => line.trim() !== "");

  // ★ 本数字ヒット数の集計
  const hitCount = [0, 0, 0, 0, 0, 0, 0];

  // ★ ボーナスヒット総数（本数字ヒット数とは無関係）
  let bonusTotal = 0;

  let html = `
    <table>
      <tr>
        <th>予想番号</th>
        <th>当選判定</th>
        <th>本数字ヒット</th>
        <th>ボーナスヒット</th>
      </tr>
  `;

  lines.forEach((line) => {
    const nums = parseNums(line);

    const hitMain = nums.filter(n => latestMain.includes(n)).length;
    const hitBonus = nums.includes(latestBonus) ? 1 : 0;

    // ★ 本数字ヒット数の集計
    hitCount[hitMain]++;

    // ★ ボーナスヒット総数
    if (hitBonus === 1) bonusTotal++;

    let judge = "";
    if (hitMain === 6) judge = "1等";
    else if (hitMain === 5 && hitBonus === 1) judge = "2等";
    else if (hitMain === 5) judge = "3等";
    else if (hitMain === 4) judge = "4等";
    else if (hitMain === 3) judge = "5等";
    else judge = "ハズレ";

    html += `
      <tr>
        <td>${line}</td>
        <td>${judge}</td>
        <td>${hitMain}</td>
        <td>${hitBonus}</td>
      </tr>
    `;
  });

  html += "</table>";
  document.getElementById("resultArea").innerHTML = html;

  // ★ 集計表（B列を右端に追加）
  let summary = `
    <table>
      <tr>
        <th>ヒット数&ボーナス</th>
        <td>6</td><td>5</td><td>4</td><td>3</td><td>2</td><td>1</td><td>0</td><td>B</td>
      </tr>
      <tr>
        <th>予想番号数</th>
        <td>${hitCount[6]}</td>
        <td>${hitCount[5]}</td>
        <td>${hitCount[4]}</td>
        <td>${hitCount[3]}</td>
        <td>${hitCount[2]}</td>
        <td>${hitCount[1]}</td>
        <td>${hitCount[0]}</td>
        <td>${bonusTotal}</td>
      </tr>
    </table>
  `;

  document.getElementById("summaryArea").innerHTML = summary;
}

// ▼ 回号選択でデータ反映
function loadLotoData() {
  const kai = document.getElementById("kaisuu").value;
  const info = lotoData.find(x => x.kai == kai);
  if (!info) return;

  document.getElementById("hiduke").value = info.date;

  document.getElementById("lm1").value = info.nums[0];
  document.getElementById("lm2").value = info.nums[1];
  document.getElementById("lm3").value = info.nums[2];
  document.getElementById("lm4").value = info.nums[3];
  document.getElementById("lm5").value = info.nums[4];
  document.getElementById("lm6").value = info.nums[5];

  document.getElementById("lb").value = info.bonus;
}

function convertRawToLotoData(rawText) {
  const lines = rawText.trim().split(/\n+/);
  const result = [];

  lines.forEach(line => {
    const parts = line.trim().split(/\s+/);

    if (parts.length < 9) return;

    const rawDate = parts[0];     // ← 日付（6/22(月)）
    const kai = parseInt(parts[1], 10);  // ← 回号

    const date = normalizeDate(rawDate); // ← 日付正規化

    const nums = parts.slice(2, 8).map(n => parseInt(n, 10));
    const bonus = parseInt(parts[8], 10);

    result.push({
      kai: kai,
      date: date,
      nums: nums,
      bonus: bonus
    });
  });

  return result;
}

// 日付を YYYY-MM-DD に変換
function normalizeDate(str) {
  const nums = str.match(/\d+/g);
  if (!nums) return "";

  let year, month, day;

  if (nums.length === 3) {
    // 例: 2026/6/22 → [2026, 6, 22]
    year = nums[0];
    month = nums[1];
    day = nums[2];
  } else if (nums.length === 2) {
    // 例: 6/22 → [6, 22]
    year = 2026; // ← 必要なら変更
    month = nums[0];
    day = nums[1];
  } else {
    return "";
  }

  month = month.padStart(2, "0");
  day = day.padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function generateLotoData() {
  const raw = document.getElementById("rawData").value;
  const data = convertRawToLotoData(raw);

  let output = "const lotoData = [\n";

  data.forEach(item => {
    output += `  { kai: ${item.kai}, date: "${item.date}", nums: [${item.nums.join(",")}], bonus: ${item.bonus} },\n`;
  });

  output += "];";

  document.getElementById("convertedOutput").textContent = output;
}

function judgeAllRounds() {
  const lines = document.getElementById("yosoAll").value
    .trim()
    .split(/\n+/)
    .filter(line => line.trim() !== "");

  if (lines.length === 0) {
    alert("予想番号を入力してください");
    return;
  }

  let html = `
    <h3>全回号での判定結果</h3>
    <table>
      <tr>
        <th>回号</th>
        <th>日付</th>
        <th>予想番号</th>
        <th>本数字ヒット</th>
        <th>ボーナス</th>
        <th>判定</th>
      </tr>
  `;

  lotoData.forEach(item => {
    const main = item.nums;
    const bonus = item.bonus;

    lines.forEach(line => {
      const nums = parseNums(line);

      const hitMain = nums.filter(n => main.includes(n)).length;
      const hitBonus = nums.includes(bonus) ? 1 : 0;

      let judge = "";
      if (hitMain === 6) judge = "1等";
      else if (hitMain === 5 && hitBonus === 1) judge = "2等";
      else if (hitMain === 5) judge = "3等";
      else if (hitMain === 4) judge = "4等";
      else if (hitMain === 3) judge = "5等";
      else judge = "ハズレ";

      html += `
        <tr>
          <td>${item.kai}</td>
          <td>${item.date}</td>
          <td>${line}</td>
          <td>${hitMain}</td>
          <td>${hitBonus}</td>
          <td>${judge}</td>
        </tr>
      `;
    });
  });

  html += "</table>";
  document.getElementById("resultArea").innerHTML = html;
}

function judgeSummaryAllRounds() {
  const lines = document.getElementById("yosoAll").value
    .trim()
    .split(/\n+/)
    .filter(line => line.trim() !== "");

  if (lines.length === 0) {
    alert("予想番号を入力してください");
    return;
  }

  let html = `<h3>予想番号ごとの過去全回号の当選集計</h3>`;

  lines.forEach(line => {
    const nums = parseNums(line);

    let count1 = 0;
    let count2 = 0;
    let count3 = 0;
    let count4 = 0;
    let count5 = 0;
    let countMiss = 0;

    lotoData.forEach(item => {
      const main = item.nums;
      const bonus = item.bonus;

      const hitMain = nums.filter(n => main.includes(n)).length;
      const hitBonus = nums.includes(bonus) ? 1 : 0;

      if (hitMain === 6) count1++;
      else if (hitMain === 5 && hitBonus === 1) count2++;
      else if (hitMain === 5) count3++;
      else if (hitMain === 4) count4++;
      else if (hitMain === 3) count5++;
      else countMiss++;
    });

    html += `
      <h4>予想番号：${line}</h4>
      <table>
        <tr>
          <th>等級</th><th>条件</th><th>過去ヒット数</th>
        </tr>
        <tr><td>1等</td><td>6ヒット</td><td>${count1}</td></tr>
        <tr><td>2等</td><td>5ヒット＋B</td><td>${count2}</td></tr>
        <tr><td>3等</td><td>5ヒット</td><td>${count3}</td></tr>
        <tr><td>4等</td><td>4ヒット</td><td>${count4}</td></tr>
        <tr><td>5等</td><td>3ヒット</td><td>${count5}</td></tr>
        <tr><td>ハズレ</td><td>0〜2ヒット</td><td>${countMiss}</td></tr>
      </table>
      <br>
    `;
  });

  document.getElementById("resultArea").innerHTML = html;
}
